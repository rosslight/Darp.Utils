name: release-please

on:
  push:
    branches: [ main ]

permissions:
  contents: write       # required for tags + releases
  pull-requests: write  # required for release PRs

jobs:
  release-please:
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  publish:
    needs:
      - release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required to attach the packages to the release and publish it
      id-token: write   # required for NuGet trusted publishing
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore

      - name: Pack
        env:
          SKIP_PROJECTS: "Darp.Utils.Messaging.Generator"
        run: |
          for file_name in ./src/**/*.csproj; do
            # Get the base name of the project file, and remove the .csproj extension.
            base_file=$(basename "$file_name")
            project_name="${base_file%.csproj}"

            # Check if the project name is in the SKIP_PROJECTS list.
            if [[ ",$SKIP_PROJECTS," == *",$project_name,"* ]]; then
                echo "Skipping project $project_name"
                continue
            fi
            dotnet pack "$file_name" --configuration Release --no-restore
          done

      # The short-lived API key is valid for one hour, so request it right before pushing
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg_name in ./src/**/bin/Release/*.nupkg; do
            dotnet nuget push "$pkg_name" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Attach .nupkg to GitHub Release and publish it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" ./src/**/bin/Release/*.nupkg --clobber \
            --repo "${{ github.repository }}"
          gh release edit "$RELEASE_TAG" --draft=false \
            --repo "${{ github.repository }}"
